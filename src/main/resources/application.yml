spring:
  application:
    name: receipttrust
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/receipttrust}
    username: ${DB_USERNAME:receipttrust}
    password: ${DB_PASSWORD:receipttrust}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:6MB}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

receipttrust:
  security:
    jwt:
      # Base64-encoded HMAC-SHA256 secret. OVERRIDE in production via JWT_SECRET.
      secret: ${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMzJieXRlcyE=}
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
  storage:
    receipt-dir: ${RECEIPT_DIR:./storage/receipts}
    profile-dir: ${PROFILE_DIR:./storage/profiles}
    # false (default): OCR-read receipt images but do NOT save them (debt backed by
    # extracted items). true: persist the image (needs a disk / object storage).
    persist-receipt-image: ${RECEIPT_IMAGE_PERSIST:false}
  debt:
    default-term-days: ${DEBT_TERM_DAYS:14}
  trust:
    initial-score: 500
    min-score: 300
    max-score: 850
  cors:
    # Comma-separated list of allowed browser origins (set FRONTEND_ORIGINS in prod).
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://localhost:5174}
  ocr:
    enabled: ${OCR_ENABLED:true}
    data-path: ${TESSDATA_PATH:./tessdata}
    language: ${OCR_LANGUAGE:eng}
  social:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    facebook:
      app-id: ${FACEBOOK_APP_ID:}
      app-secret: ${FACEBOOK_APP_SECRET:}
  image-expiry:
    # true = testing (auto-delete images on expiry); false = live (keep images)
    enabled: ${IMAGE_EXPIRY_ENABLED:false}
    receipt-ttl-seconds: ${RECEIPT_IMAGE_TTL_SECONDS:60}
    profile-ttl-seconds: ${PROFILE_IMAGE_TTL_SECONDS:3600}
    sweep-interval-ms: ${IMAGE_EXPIRY_SWEEP_INTERVAL_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
