spring:
  application:
    name: receipttrust
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/receipttrust}
    username: ${DB_USERNAME:receipttrust}
    password: ${DB_PASSWORD:receipttrust}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:12MB}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

receipttrust:
  security:
    jwt:
      # Base64-encoded HMAC-SHA256 secret. OVERRIDE in production via JWT_SECRET.
      secret: ${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMzJieXRlcyE=}
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
  storage:
    receipt-dir: ${RECEIPT_DIR:./storage/receipts}
    profile-dir: ${PROFILE_DIR:./storage/profiles}
  debt:
    default-term-days: ${DEBT_TERM_DAYS:14}
  trust:
    initial-score: 500
    min-score: 300
    max-score: 850
  cors:
    # Comma-separated list of allowed browser origins (set FRONTEND_ORIGINS in prod).
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://localhost:5174}
  ocr:
    enabled: ${OCR_ENABLED:true}
    data-path: ${TESSDATA_PATH:./tessdata}
    language: ${OCR_LANGUAGE:eng}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
